<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Product Selling | Class 9–12 Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#12203A;--mute:#5A6782;--line:#DDE3EE;--blue:#1F4FE0;--blue-d:#173DB4;--yel:#FFD23F;--red:#FF3B30;--wa:#1FA855}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Hind','Noto Sans Devanagari',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:17px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.2;margin:0}
a{color:inherit}
.btn{display:inline-block;padding:14px 26px;border-radius:12px;font-weight:700;font-size:17px;text-decoration:none;border:2px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;font-family:inherit;transition:background .15s;text-align:center}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.ghost:hover{background:#E8EEFF}
.btn.wa{background:var(--wa);border-color:var(--wa)}
.btn.wa:hover{background:#17893F}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}

/* top bar */
.bar{background:var(--ink);padding:12px 0}
.bar .wrap{display:flex;justify-content:flex-end}
.lang{display:inline-flex;border:1px solid #3A4A6B;border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:#C4CEE3;font:600 15px 'Hind',sans-serif;padding:6px 18px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--yel);color:var(--ink)}

/* hero */
.hero{background:var(--ink);color:#fff;padding:56px 0 72px}
.hero .wrap{display:grid;gap:40px;grid-template-columns:1fr 1fr;align-items:center}
.tag{display:inline-block;background:var(--yel);color:var(--ink);font-weight:700;padding:4px 14px;border-radius:999px;font-size:15px;margin-bottom:16px}
.hero h1{font-size:clamp(30px,5vw,48px);font-weight:700}
.hero p{color:#C4CEE3;margin:14px 0 0;font-size:18px}
.vid{position:relative;display:block;aspect-ratio:16/10;border-radius:18px;background:linear-gradient(135deg,#1F4FE0,#12307F);text-decoration:none;color:#fff;overflow:hidden;box-shadow:0 0 0 0 rgba(255,210,63,.7);animation:ring 1.6s infinite}
.vid::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px)}
.play{position:absolute;left:50%;top:44%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;background:var(--yel);animation:beat 1.2s infinite}
.play::after{content:'';position:absolute;left:36px;top:26px;border-left:30px solid var(--ink);border-top:18px solid transparent;border-bottom:18px solid transparent}
.vlabel{position:absolute;left:0;right:0;bottom:0;padding:14px;background:rgba(10,20,40,.55);text-align:center;font-weight:700;font-size:20px;animation:blink 1s steps(2,start) infinite}
.live{position:absolute;top:14px;left:14px;background:var(--red);color:#fff;font-weight:700;font-size:14px;padding:3px 12px;border-radius:6px;animation:blink 1s steps(2,start) infinite}
@keyframes ring{70%{box-shadow:0 0 0 22px rgba(255,210,63,0)}100%{box-shadow:0 0 0 0 rgba(255,210,63,0)}}
@keyframes beat{50%{transform:scale(1.14)}}
@keyframes blink{50%{opacity:.35}}
.hero .btn{margin-top:22px;background:var(--yel);border-color:var(--yel);color:var(--ink);font-size:19px;padding:15px 30px;animation:beat 1.2s infinite}
.hero .btn:hover{background:#F2C21F}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}}

section{padding:56px 0}
.sh{font-size:clamp(26px,4vw,34px);font-weight:700}
.sub{color:var(--mute);margin:6px 0 28px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.course{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px}
.course h3{font-size:20px}
.course p{margin:0;color:var(--mute);font-size:16px;flex:1}
.course .len{font-weight:600;color:var(--blue);font-size:15px}
.course .btn{padding:11px 18px;font-size:16px}

.product{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.box{display:grid;gap:28px;grid-template-columns:1.2fr 1fr;align-items:center;background:var(--bg);border:2px solid var(--ink);border-radius:18px;padding:32px}
.box ul{padding-left:20px;margin:14px 0 0;color:var(--mute)}
.price{background:var(--card);border-radius:14px;padding:24px;text-align:center;border:1px solid var(--line)}
.price .old{color:var(--mute);font-size:15px}
.price .amt{font-size:52px;font-weight:700;line-height:1.1}
.price .amt span{background:linear-gradient(transparent 62%,var(--yel) 62%)}
.price .btn{display:block;margin-top:16px}
.price .btn+.btn{margin-top:10px}
@media(max-width:700px){.box{grid-template-columns:1fr;padding:22px}}
.free{text-align:center}

details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 20px}
summary{cursor:pointer;font-weight:600;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:14px}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';font-size:24px;line-height:1;color:var(--blue)}
details[open] summary::after{content:'−'}
details p{margin:0 0 16px;color:var(--mute)}

.contact{background:var(--ink);color:#fff;text-align:center}
.contact p{color:#C4CEE3;margin:8px 0 22px}
.num{font-size:22px;font-weight:700;margin-bottom:20px}
footer{background:#0C1628;color:#8C9AB8;text-align:center;padding:18px;font-size:14px}

dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100% - 28px));max-height:calc(100% - 28px);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,40,.35)}
dialog::backdrop{background:rgba(10,20,40,.6)}
.d-in{padding:26px}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.d-head h3{font-size:22px}
.x{background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:var(--mute);padding:0 4px}
.chip{display:inline-block;font-weight:700;font-size:14px;padding:2px 12px;border-radius:999px;margin:14px 0 6px}
.chip.f{background:#DDF5E5;color:#0F6B30}
.chip.p{background:#FFF0B8;color:#6B5200}
.lk{display:block;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:8px;font-weight:600}
.lk:hover{border-color:var(--blue);background:#F0F4FF}
.lk small{display:block;font-weight:400;color:var(--mute);font-size:14px}
.lk.soon{opacity:.55;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
